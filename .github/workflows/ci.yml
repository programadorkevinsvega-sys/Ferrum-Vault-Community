name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust provider (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustc +1.100.0 --version

      - name: Verify committed lockfile
        run: cargo +1.100.0 metadata --locked --format-version 1
      - name: Ensure AWS SDK remains optional in the default dependency graph
        shell: bash
        run: |
          set -euo pipefail
          if cargo +1.100.0 tree --locked -p ferrum-seal --no-default-features | grep -Eq 'aws-config|aws-sdk-kms'; then
            echo "AWS SDK crates leaked into the default ferrum-seal dependency graph." >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo +1.100.0 fmt --all -- --check

      - name: Run unit, integration and benchmark-build tests
        run: cargo +1.100.0 test --locked --workspace --all-targets

      - name: Run Clippy with warnings denied
        run: cargo +1.100.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Record benchmark environment
        if: matrix.target == 'linux-x86_64'
        shell: bash
        run: |
          uname -a
          cat /etc/os-release
          rustc +1.100.0 --version
          cargo +1.100.0 --version
          lscpu
          nproc

      - name: Benchmark AES-256-GCM provider
        if: matrix.target == 'linux-x86_64'
        run: cargo +1.100.0 bench --locked --bench aes_256_gcm -- --sample-size 10 --warm-up-time 1 --measurement-time 2

  crypto-fuzz-smoke:
    name: Crypto fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - seal_open_roundtrip
          - open_arbitrary_payload
          - authentication_mutations
          - wrapped_key_decode
          - key_context_mutations
          - recovery_share_decode
          - recovery_share_mutations
          - seal_bootstrap_transitions
          - root_quorum_authorization
          - shamir_unsealer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned fuzz toolchain
        run: rustup toolchain install nightly-2026-11-12 --profile minimal

      - name: Install pinned cargo-fuzz
        run: cargo +nightly-2026-11-12 install cargo-fuzz --version 0.13.2 --locked

      - name: Verify fuzz workspace lockfile
        run: cargo +nightly-2026-11-12 metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1

      - name: Run 60-second ${{ matrix.target }} fuzz smoke test
        run: cargo +nightly-2026-11-12 fuzz run ${{ matrix.target }} -- -max_total_time=60 -max_len=65536 -timeout=10

      - name: Retain crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crypto-fuzz-failure-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 14

  msrv:
    name: MSRV (Rust 1.98.0)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install minimum supported Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Verify committed lockfile with MSRV Cargo
        run: cargo +1.98.0 metadata --locked --format-version 1

      - name: Test minimum supported Rust version
        run: cargo +1.98.0 test --locked --workspace --all-targets

      - name: Test optional KMS feature on MSRV
        run: cargo +1.98.0 test --locked -p ferrum-seal --features aws-kms

      - name: Compile official AWS SDK live example on MSRV
        run: cargo +1.98.0 check --locked -p ferrum-seal --features aws-kms --examples

  miri-kmp:
    name: Miri (pure-Rust KMP parser)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Miri toolchain
        run: rustup toolchain install nightly-2026-11-12 --profile minimal --component miri
      - name: Prepare Miri sysroot
        run: cargo +nightly-2026-11-12 miri setup
      - name: Run pure-Rust KMP parser tests under Miri
        run: cargo +nightly-2026-11-12 miri test --locked -p ferrum-crypto --lib kmp::tests

  kms-adapter:
    name: Optional AWS SDK adapter and in-memory fake tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Test KMS adapter with in-memory fake only
        run: cargo +1.100.0 test --locked -p ferrum-seal --features aws-kms
      - name: Compile official AWS SDK live example without credentials
        run: cargo +1.100.0 check --locked -p ferrum-seal --features aws-kms --examples


  prepare-aws-sdk-lockfiles:
    name: Generate optional AWS SDK lockfile artifact
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Cargo toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Resolve AWS SDK optional feature and export lockfiles
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.100.0 metadata --features ferrum-seal/aws-kms --format-version 1 >/dev/null
          mkdir -p /tmp/aws-sdk-lockfiles
          cp Cargo.lock /tmp/aws-sdk-lockfiles/Cargo.lock
          cargo +1.100.0 metadata --manifest-path fuzz/Cargo.toml --features ferrum-seal/aws-kms --format-version 1 >/dev/null
          cp fuzz/Cargo.lock /tmp/aws-sdk-lockfiles/fuzz-Cargo.lock
      - name: Upload generated lockfiles for commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aws-sdk-generated-lockfiles
          path: /tmp/aws-sdk-lockfiles/
          if-no-files-found: error
          retention-days: 1
  quality:
    name: Public repository quality gates
    needs: [rust, crypto-fuzz-smoke, msrv, miri-kmp, kms-adapter]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whitespace and patch errors
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "origin/${{ github.base_ref }}...HEAD"
      - name: Validate public Markdown links and anchors
        run: python3 scripts/check_markdown_links.py
      - name: Validate AWS KMS live script syntax and policy JSON
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/aws-kms-live-verify.sh
          python3 -m json.tool docs/security/aws-kms-runtime-role-policy.example.json >/dev/null
          python3 -m json.tool docs/security/aws-kms-key-policy-statement.example.json >/dev/null
          python3 -m json.tool docs/security/aws-kms-audit-role-policy.example.json >/dev/null
