[workspace]
members = ["crates/crypto", "crates/recovery"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
rust-version = "1.98"
repository = "https://github.com/programadorkevinsvega-sys/Ferrum-Vault-Community"

[workspace.dependencies]
async-trait = "=0.1.89"
aws-lc-rs = { version = "=1.19.0", default-features = false, features = ["non-fips"] }
criterion = "=0.8.2"
rand = { version = "=0.10.3", default-features = false, features = ["thread_rng", "std_rng"] }
rand_core = "=0.10.1"
serde_json = "1"
vsss-rs = { version = "=6.0.1", default-features = false, features = ["std", "zeroize"] }
zeroize = "=1.9.1"
