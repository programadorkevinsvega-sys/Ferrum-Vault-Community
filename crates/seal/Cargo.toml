[package]
name = "ferrum-seal"
version = "0.1.0"
description = "Seal lifecycle and one-time bootstrap state machine for Ferrum Community"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
default = []
aws-kms = ["dep:aws-config", "dep:aws-sdk-kms", "dep:tokio"]

[dependencies]
async-trait.workspace = true
aws-config = { version = "=1.13.2", optional = true, features = ["behavior-version-latest"] }
aws-sdk-kms = { version = "=1.129.0", optional = true, features = ["behavior-version-latest"] }
tokio = { version = "=1.54.1", optional = true, features = ["macros", "rt-multi-thread"] }
aws-lc-rs.workspace = true
ferrum-recovery = { path = "../recovery" }
zeroize.workspace = true

[[example]]
name = "aws_kms_live_verify"
path = "examples/aws_kms_live_verify.rs"
required-features = ["aws-kms"]
