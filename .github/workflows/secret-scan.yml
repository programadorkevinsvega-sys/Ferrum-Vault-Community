name: Secret history scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-secret-history-scan-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gitleaks:
    name: Gitleaks — all fetched Git history and refs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify refs available to the scan
        shell: bash
        run: |
          set -euo pipefail
          git for-each-ref --format='%(refname)' refs/heads refs/remotes refs/tags
          ref_count="$(git for-each-ref --format='%(refname)' refs/heads refs/remotes refs/tags | wc -l)"
          if [ "${ref_count}" -eq 0 ]; then
            echo "::error::No Git refs were fetched; refusing to report a successful history scan."
            exit 1
          fi
      - name: Scan every commit reachable from fetched refs
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          set +e
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --volume "${RUNNER_TEMP}/gitleaks:/reports" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --config /repo/.gitleaks.toml --log-opts="--all" --redact --no-banner \
            --report-format json --report-path /reports/gitleaks-report.json \
            --exit-code=1 .
          scan_status=$?
          set -e
          if [ -f "${RUNNER_TEMP}/gitleaks/gitleaks-report.json" ]; then
            echo "::group::Gitleaks redacted findings (no secret values)"
            cat "${RUNNER_TEMP}/gitleaks/gitleaks-report.json"
            echo "::endgroup::"
          else
            echo "::error::Gitleaks did not produce its expected report."
            exit 2
          fi
          exit "${scan_status}"
