[package]
name = "ferrum-crypto-fuzz"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
ferrum-crypto = { path = "../crates/crypto" }
ferrum-recovery = { path = "../crates/recovery" }
ferrum-seal = { path = "../crates/seal" }
libfuzzer-sys = "=0.4.13"
rand = { version = "=0.10.3", default-features = false, features = ["std_rng"] }
rand_core = "=0.10.1"

[[bin]]
name = "seal_open_roundtrip"
path = "fuzz_targets/seal_open_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open_arbitrary_payload"
path = "fuzz_targets/open_arbitrary_payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "authentication_mutations"
path = "fuzz_targets/authentication_mutations.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wrapped_key_decode"
path = "fuzz_targets/wrapped_key_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "key_context_mutations"
path = "fuzz_targets/key_context_mutations.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recovery_share_decode"
path = "fuzz_targets/recovery_share_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recovery_share_mutations"
path = "fuzz_targets/recovery_share_mutations.rs"
test = false
doc = false
bench = false

[workspace]
members = []
resolver = "3"

[[bin]]
name = "seal_bootstrap_transitions"
path = "fuzz_targets/seal_bootstrap_transitions.rs"
test = false
doc = false
bench = false
[[bin]]
name = "root_quorum_authorization"
path = "fuzz_targets/root_quorum_authorization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shamir_unsealer"
path = "fuzz_targets/shamir_unsealer.rs"
test = false
doc = false
bench = false
